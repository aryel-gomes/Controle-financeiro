<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ECFDF5" stop-opacity="0.85" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#6EE7B7" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Wallet Body -->
  <g filter="url(#shadow)">
    <!-- Main Wallet Pocket -->
    <path
      d="M13 22C13 18.6863 15.6863 16 19 16H45C48.3137 16 51 18.6863 51 22V44C51 47.3137 48.3137 50 45 50H19C15.6863 50 13 47.3137 13 44V22Z"
      fill="#064E3B"
      opacity="0.4"
    />
    <rect
      x="12"
      y="20"
      width="40"
      height="28"
      rx="6"
      fill="url(#cardGrad)"
    />

    <!-- Wallet Front Flap -->
    <path
      d="M12 26C12 22.6863 14.6863 20 18 20H46C49.3137 20 52 22.6863 52 26V29H12V26Z"
      fill="#10B981"
      opacity="0.25"
    />

    <!-- Wallet Clasp / Card Tab -->
    <rect
      x="36"
      y="29"
      width="18"
      height="12"
      rx="4"
      fill="#047857"
    />

    <!-- Gold Emblem Coin on Clasp -->
    <circle
      cx="45"
      cy="35"
      r="3.5"
      fill="url(#coinGrad)"
    />

    <!-- Growth Arrow / Financial Upward Metric -->
    <path
      d="M20 38L27 30L32 34L40 23"
      fill="none"
      stroke="#059669"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M35 23H40V28"
      fill="none"
      stroke="#059669"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
